<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Read the Oakland El space books one page at a time.">
  <title>Oakland El Book Library</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23132445'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffc667'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='4' transform='rotate(-25 16 16)' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="reader.css">
  <script defer src="reader.js"></script>
</head>
<body>
  <header class="site-header"><span class="mark" aria-hidden="true">✦</span><span>Oakland El <strong>Book Library</strong></span></header>
  <main>
    <section id="library" aria-labelledby="library-title">
      <div class="library-heading"><h1 id="library-title">Choose a book</h1><p>Our first six space books</p></div>
      <div id="shelf" class="shelf" aria-busy="true"></div>
      <p id="library-status" role="status">Loading books...</p>
    </section>
    <section id="reader" hidden aria-labelledby="book-title">
      <div class="reader-heading"><button id="library-button" class="quiet">Books</button><h1 id="book-title"></h1><button id="fullscreen-button" class="quiet">Full screen</button></div>
      <div id="page-stage" class="page-stage" aria-busy="false">
        <img id="book-page" alt="" width="1165" height="1800">
        <p id="page-status" class="page-status" role="status" hidden></p>
      </div>
      <nav class="reader-controls" aria-label="Book pages">
        <button id="previous-button" class="page-button">Back</button>
        <span id="page-count" role="status" aria-live="polite"></span>
        <button id="next-button" class="page-button primary">Next</button>
      </nav>
      <div id="end-actions" class="end-actions" hidden><button id="again-button">Read again</button><button id="done-button">All done</button></div>
    </section>
    <noscript><p>Turn on JavaScript to open the book reader.</p></noscript>
  </main>
</body>
</html>
